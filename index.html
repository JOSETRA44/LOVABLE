<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Minimalista | Alex Dev</title>
    <meta name="description" content="Portafolio virtual minimalista de Alex Dev, Desarrollador Full Stack.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="logo" id="profile-name">Cargando...</h1>
            <p class="role" id="profile-role"></p>
        </div>
    </header>

    <main class="main-content">

        <section class="section about" id="about">
            <div class="container">
                <h2 class="section-title">Sobre mí</h2>
                <p id="profile-bio"></p>
                <div class="contact-info" id="profile-contact">
                    <!-- Contact links will be injected here -->
                </div>
            </div>
        </section>

        <section class="section skills" id="skills">
            <div class="container">
                <h2 class="section-title">Habilidades</h2>
                <ul class="skills-list" id="skills-list">
                    <!-- Skills will be injected here -->
                </ul>
            </div>
        </section>

        <section class="section projects" id="projects">
            <div class="container">
                <h2 class="section-title">Proyectos Seleccionados</h2>
                <div class="projects-grid" id="projects-grid">
                    <!-- Projects will be injected here -->
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year"></span> <span id="footer-name"></span>. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
